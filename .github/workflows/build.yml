name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Download real Tesseract language data
        run: |
          for lang in ara eng; do
            curl -fL --retry 3 -o "app/src/main/assets/tessdata/${lang}.traineddata" \
              "https://github.com/tesseract-ocr/tessdata_fast/raw/main/${lang}.traineddata" \
              || echo "::warning::could not download ${lang}.traineddata, keeping placeholder"
          done
          ls -l app/src/main/assets/tessdata

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: driveflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
